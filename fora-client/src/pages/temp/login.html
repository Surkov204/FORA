<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Login</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Inter, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            width: 320px;
            background: #111;
            padding: 24px;
            border-radius: 12px;
        }
        input, button {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }
        button {
            background: #1d9bf0;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
</div>

<script src="login.js"></script>
</body>
</html>
